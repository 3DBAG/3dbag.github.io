  <div class="footer-bottom wrap"><span>© {{ now.Year }} {{ .Site.Title }}</span><a class="footer-github" href="https://github.com/3DBAG" aria-label="3DBAG GitHub"><span aria-hidden="true">{{ (resources.Get "ananke/socials/github.svg").Content | safeHTML }}</span></a></div>
</footer>
