<header class="site-header wrap">
  <a class="brand" href="{{ .Site.Home.RelPermalink }}"><img src="{{ printf "img/3dbag-platform-slab-stacked-%s.svg" .Language.Lang | relURL }}" width="350" height="153" alt="3DBAG {{ if eq .Language.Lang "nl" }}Innovatie Platform{{ else }}Innovation Platform{{ end }}"></a>
  <nav aria-label="{{ if eq .Language.Lang "nl" }}Hoofdnavigatie{{ else }}Main navigation{{ end }}">
    {{ range .Site.Menus.main }}<a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
  </nav>
  <div class="languages" role="group" aria-label="{{ if eq .Language.Lang "nl" }}Taal{{ else }}Language{{ end }}"><span aria-current="true">{{ upper .Language.Lang }}</span>{{ range .Translations }}<a href="{{ .RelPermalink }}" lang="{{ .Language.Lang }}" hreflang="{{ .Language.Lang }}">{{ upper .Language.Lang }}</a>{{ end }}</div>
</header>
